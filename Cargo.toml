[package]
name = "mcat"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.13.4"
sha2 = "0.11.0"
# 纯 Rust 的 regex 后端，避免 onig(C) 依赖
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
