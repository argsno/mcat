[package]
name = "mcat"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = "0.13.4"
# 纯 Rust 的 regex 后端，避免 onig(C) 依赖
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
unicode-width = "0.2.2"
