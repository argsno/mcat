[package]
name = "mcat"
version = "0.10.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
# 配置文件（TOML）。只开解析：不需要序列化，也不需要它自带的显示和颜色支持。
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# mermaid 图：解析、布局、光栅化成 PNG。纯 Rust，无 C 依赖。
# 只开 render + raster，不开 ascii —— 框线字符渲染的效果不足以进终端正文。
merman = { version = "0.7.0", features = ["render", "raster"] }
# 终端 termios：查背景色前把控制终端切到原始模式。terminal_size 已经
# 带进这份依赖，这里只是直接用它，不新增编译单元。
rustix = { version = "1.1.5", features = ["termios"] }
pulldown-cmark = "0.13.4"
# reStructuredText：docutils 的 Rust 移植，纯 Rust，只带进 unicode-normalization 和 tinyvec。
lsdocs-rst = "0.1.0"
sha2 = "0.11.0"
# 纯 Rust 的 regex 后端，避免 onig(C) 依赖。只开用得到的部分：
# default-fancy 还会带进 html、plist-load、yaml-load 和默认语法集，mcat 都用不到。
syntect = { version = "5.3.0", default-features = false, features = [
    "default-themes",
    "parsing",
    "regex-fancy",
] }
# bat 维护的语法集：syntect 自带的 75 种之外还有 TypeScript、TOML、Swift 等。
# 必须用 fancy 变体，onig 变体和 syntect 的 regex-onig 一样会拉 C 依赖。
two-face = { version = "0.5.2", default-features = false, features = [
    "syntect-fancy",
] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
